
<!DOCTYPE html>
<html>
<head>
    <title>ENI & LO - Direct Stream Test</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background: black; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        video { width: 90vw; height: 90vh; }
    </style>
</head>
<body>
    <video id="video" controls autoplay></video>
    <script>
        var video = document.getElementById('video');
        if (Hls.isSupported()) {
            var hls = new Hls();
            hls.loadSource('https://lb8.strmd.st/secure/DhdrqtcYFHpDIMjtNEwsaxwKVkaZlIqu/rtmp/stream/bKb6nEceVDLnpv7bUo-GhltBlzKXUXvHPpL4ZlCq1xBKKGM_gN-rdzgoEc_w4S9_rpNfyGCwaTcR4g/1/playlist.m3u8');
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play();
            });
        }
    </script>
</body>
</html>
